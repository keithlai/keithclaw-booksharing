<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>💰 Keith書單 — Material You</title>

<!-- Material Symbols & Fonts (Google CDN) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0..200" rel="stylesheet" />

<style>
/* ======= Material Design 3 Theme Tokens (Dynamic Colors) ======= */
:root {
  /* Primary palette */
  --md-sys-color-primary: #6750A4;
  --md-sys-color-on-primary: #FFFFFF;
  --md-sys-color-primary-container: #EADDFF;
  --md-sys-color-on-primary-container: #21005D;

  /* Secondary palette */
  --md-sys-color-secondary: #625B71;
  --md-sys-color-on-secondary: #FFFFFF;
  --md-sys-color-secondary-container: #E8DEF8;
  --md-sys-color-on-secondary-container: #1D192B;

  /* Tertiary palette */
  --md-sys-color-tertiary: #7D5260;
  --md-sys-color-on-tertiary: #FFFFFF;
  --md-sys-color-tertiary-container: #FFD8E4;
  --md-sys-color-on-tertiary-container: #31111D;

  /* Error */
  --md-sys-color-error: #B3261E;
  --md-sys-color-on-error: #FFFFFF;
  --md-sys-color-error-container: #F9DEDC;
  --md-sys-color-on-error-container: #410E0B;

  /* Surface & Background */
  --md-sys-color-background: #FFFBFE;
  --md-sys-color-on-background: #1C1B1F;
  --md-sys-color-surface: #FFFBFE;
  --md-sys-color-on-surface: #1C1B1F;
  --md-sys-color-surface-variant: #E7E0EC;
  --md-sys-color-on-surface-variant: #49454F;

  /* Outline */
  --md-sys-color-outline: #79747E;
  --md-sys-color-outline-variant: #CAC4D0;

  /* Shadows */
  --md-sys-elevation-level0: 0 0 0 0 transparent;
  --md-sys-elevation-level1: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
  --md-sys-elevation-level2: 0 2px 6px rgba(0,0,0,.14), 0 1px 3px rgba(0,0,0,.1);
  --md-sys-elevation-level3: 0 4px 12px rgba(0,0,0,.16), 0 2px 5px rgba(0,0,0,.1);
  --md-sys-elevation-level4: 0 6px 20px rgba(0,0,0,.18), 0 3px 7px rgba(0,0,0,.12);

  /* Radius */
  --md-sys-shape-extra-small: 4px;
  --md-sys-shape-small: 8px;
  --md-sys-shape-medium: 12px;
  --md-sys-shape-large: 16px;
  --md-sys-shape-extra-large: 28px;
  --md-sys-shape-full: 9999px;

  /* Motion */
  --md-sys-motion-easing-emphasized: cubic-bezier(.2,0,0,1);
  --md-sys-motion-duration-short: 150ms;
  --md-sys-motion-duration-medium: 300ms;
  --md-sys-motion-duration-long: 400ms;

  /* Container / sizing */
  --top-bar-height: 64px;
  --content-max-width: 1200px;
  --grid-gap: 16px;
}

/* ======= Dark Theme ======= */
[data-theme="dark"] {
  --md-sys-color-primary: #D0BCFF;
  --md-sys-color-on-primary: #381E72;
  --md-sys-color-primary-container: #4F378B;
  --md-sys-color-on-primary-container: #EADDFF;

  --md-sys-color-secondary: #CCC2DC;
  --md-sys-color-on-secondary: #332D41;
  --md-sys-color-secondary-container: #4A4458;
  --md-sys-color-on-secondary-container: #E8DEF8;

  --md-sys-color-tertiary: #EFB8C8;
  --md-sys-color-on-tertiary: #492532;
  --md-sys-color-tertiary-container: #633B48;
  --md-sys-color-on-tertiary-container: #FFD8E4;

  --md-sys-color-error: #F2B8B5;
  --md-sys-color-on-error: #601410;
  --md-sys-color-error-container: #8C1D18;
  --md-sys-color-on-error-container: #F9DEDC;

  --md-sys-color-background: #1C1B1F;
  --md-sys-color-on-background: #E6E1E5;
  --md-sys-color-surface: #1C1B1F;
  --md-sys-color-on-surface: #E6E1E5;
  --md-sys-color-surface-variant: #49454F;
  --md-sys-color-on-surface-variant: #CAC4D0;

  --md-sys-color-outline: #938F99;
  --md-sys-color-outline-variant: #49454F;

  --md-sys-elevation-level1: 0 1px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.24);
  --md-sys-elevation-level2: 0 2px 6px rgba(0,0,0,.36), 0 1px 3px rgba(0,0,0,.28);
  --md-sys-elevation-level3: 0 4px 12px rgba(0,0,0,.42), 0 2px 5px rgba(0,0,0,.3);
  --md-sys-elevation-level4: 0 6px 20px rgba(0,0,0,.48), 0 3px 7px rgba(0,0,0,.36);
}

/* ======= Reset & Base ======= */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--md-sys-color-background);
  color:var(--md-sys-color-on-background);
  min-height:100vh;
  line-height:1.5;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

/* ======= Top App Bar (M3) ======= */
.top-app-bar{
  position:sticky;top:0;z-index:100;
  height:var(--top-bar-height);
  background:var(--md-sys-color-surface);
  border-bottom:1px solid var(--md-sys-color-outline-variant);
  display:flex;
  align-items:center;
  padding:0 24px;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
}
.top-app-bar .leading-icon{
  display:flex;align-items:center;justify-content:center;
  width:40px;height:40px;
  border-radius:var(--md-sys-shape-full);
  background:var(--md-sys-color-primary-container);
  color:var(--md-sys-color-on-primary-container);
  margin-right:16px;
  flex-shrink:0;
  user-select:none;
}
.top-app-bar .leading-icon .material-symbols-rounded{
  font-size:24px;
  font-variation-settings:'FILL'1,'wght'400;
}
.top-app-bar .headline{
  font-size:22px;
  font-weight:600;
  color:var(--md-sys-color-on-surface);
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.top-app-bar .trailing-area{
  display:flex;align-items:center;gap:8px;
}
.m3-badge{
  display:inline-flex;align-items:center;gap:6px;
  height:32px;padding:0 12px;
  border-radius:var(--md-sys-shape-full);
  background:var(--md-sys-color-surface-variant);
  color:var(--md-sys-color-on-surface-variant);
  font-size:13px;
  font-weight:500;
}
.m3-badge .material-symbols-rounded{
  font-size:16px;
  font-variation-settings:'FILL'0,'wght'500;
}
.m3-badge .count{
  font-weight:600;
  color:var(--md-sys-color-primary);
}
[data-theme="dark"] .m3-badge .count{color:var(--md-sys-color-primary);}

/* Theme toggle */
.theme-btn{
  display:flex;align-items:center;justify-content:center;
  width:40px;height:40px;
  border:none;border-radius:var(--md-sys-shape-full);
  background:transparent;
  color:var(--md-sys-color-on-surface-variant);
  cursor:pointer;
  transition:background var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-emphasized);
}
.theme-btn:hover{background:var(--md-sys-color-surface-variant);}
.theme-btn .material-symbols-rounded{
  font-size:22px;
  font-variation-settings:'FILL'0,'wght'400;
}

/* ======= Content Area ======= */
.content{
  max-width:var(--content-max-width);
  margin:0 auto;
  padding:20px 24px 80px;
}

/* ======= M3 Text Field with Leading Icon ======= */
.search-field{
  position:relative;
  margin-bottom:20px;
}
.search-field .m3-input{
  width:100%;
  height:56px;
  padding:16px 56px 16px 56px;
  border:1px solid var(--md-sys-color-outline);
  border-radius:var(--md-sys-shape-large);
  background:var(--md-sys-color-surface);
  color:var(--md-sys-color-on-surface);
  font-family:inherit;
  font-size:16px;
  outline:none;
  transition:border-color var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-emphasized),
              box-shadow var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-emphasized);
}
.search-field .m3-input::placeholder{color:var(--md-sys-color-on-surface-variant);}
.search-field .m3-input:focus{
  border-color:var(--md-sys-color-primary);
  box-shadow:inset 0 0 0 1px var(--md-sys-color-primary);
}
.search-field .leading-icon{
  position:absolute;
  left:16px;
  top:50%;
  transform:translateY(-50%);
  color:var(--md-sys-color-on-surface-variant);
  pointer-events:none;
  display:flex;
}
.search-field .leading-icon .material-symbols-rounded{
  font-size:24px;
  font-variation-settings:'FILL'0,'wght'400;
}
.search-field .trailing-icon{
  position:absolute;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  color:var(--md-sys-color-on-surface-variant);
  cursor:pointer;
  display:flex;
  border:none;background:none;padding:4px;
  border-radius:var(--md-sys-shape-full);
  transition:opacity var(--md-sys-motion-duration-short) ease;
  opacity:0;
  visibility:hidden;
}
.search-field .trailing-icon.visible{
  opacity:1;
  visibility:visible;
}
.search-field .trailing-icon:hover{background:var(--md-sys-color-surface-variant);}
.search-field .trailing-icon .material-symbols-rounded{
  font-size:20px;
  font-variation-settings:'FILL'0,'wght'400;
}

/* ======= Filter Row: Diff Buttons (M3 Filter Chips) ======= */
.filter-row{
  display:flex;
  gap:8px;
  margin-bottom:24px;
  flex-wrap:wrap;
  align-items:center;
}
.m3-chip{
  display:inline-flex;align-items:center;
  height:40px;padding:0 16px;
  border-radius:var(--md-sys-shape-small);
  border:1px solid var(--md-sys-color-outline);
  background:transparent;
  color:var(--md-sys-color-on-surface-variant);
  font-family:inherit;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  white-space:nowrap;
  transition:all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-emphasized);
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.m3-chip:hover{
  background:color-mix(in srgb, var(--md-sys-color-on-surface) 8%, transparent);
}
.m3-chip.active{
  background:var(--md-sys-color-secondary-container);
  border-color:var(--md-sys-color-secondary-container);
  color:var(--md-sys-color-on-secondary-container);
}
.m3-chip .chip-icon{
  display:flex;margin-right:6px;
}
.m3-chip .chip-icon .material-symbols-rounded{
  font-size:16px;
  font-variation-settings:'FILL'0,'wght'500;
}

/* ======= M3 Tabs (Segmented-like, scrollable) ======= */
.tab-bar{
  display:flex;
  gap:12px;
  margin-bottom:24px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  -ms-overflow-style:none;
  padding-bottom:4px;
}
.tab-bar::-webkit-scrollbar{display:none}
.m3-tab{
  display:inline-flex;align-items:center;gap:8px;
  height:40px;padding:0 20px;
  border-radius:var(--md-sys-shape-extra-large);
  border:1px solid var(--md-sys-color-outline-variant);
  background:transparent;
  color:var(--md-sys-color-on-surface-variant);
  font-family:inherit;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  white-space:nowrap;
  transition:all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-emphasized);
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  flex-shrink:0;
}
.m3-tab:hover{
  background:color-mix(in srgb, var(--md-sys-color-on-surface) 6%, transparent);
}
.m3-tab.active{
  background:var(--md-sys-color-primary-container);
  border-color:var(--md-sys-color-primary-container);
  color:var(--md-sys-color-on-primary-container);
}
.m3-tab .dot{
  display:inline-block;
  width:10px;height:10px;
  border-radius:var(--md-sys-shape-full);
  flex-shrink:0;
  transition:transform var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-emphasized);
}
.m3-tab.active .dot{transform:scale(1.15);}

/* ======= Book Grid ======= */
.book-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(360px,1fr));
  gap:var(--grid-gap);
}

/* ======= M3 Elevated Card ======= */
.m3-card{
  background:var(--md-sys-color-surface);
  border:1px solid var(--md-sys-color-outline-variant);
  border-radius:var(--md-sys-shape-medium);
  box-shadow:var(--md-sys-elevation-level1);
  padding:24px 20px 20px;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  transition:box-shadow var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized),
              transform var(--md-sys-motion-duration-medium) var(--md-sys-motion-easing-emphasized),
              border-color var(--md-sys-motion-duration-short) ease;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  animation:fadeSlideUp var(--md-sys-motion-duration-long) var(--md-sys-motion-easing-emphasized) both;
}
.m3-card:hover{
  box-shadow:var(--md-sys-elevation-level2);
  transform:translateY(-2px);
  border-color:var(--md-sys-color-outline);
}
.m3-card:active{
  box-shadow:var(--md-sys-elevation-level1);
  transform:translateY(0);
}

/* Bookmark button (M3 Icon Button) */
.m3-card .bookmark-btn{
  position:absolute;
  top:12px;right:12px;
  width:36px;height:36px;
  border-radius:var(--md-sys-shape-full);
  border:1px solid var(--md-sys-color-outline-variant);
  background:var(--md-sys-color-surface);
  color:var(--md-sys-color-on-surface-variant);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  z-index:3;
  transition:all var(--md-sys-motion-duration-short) var(--md-sys-motion-easing-emphasized);
}
.m3-card .bookmark-btn:hover{
  background:var(--md-sys-color-surface-variant);
  box-shadow:var(--md-sys-elevation-level1);
}
.m3-card .bookmark-btn.active{
  background:var(--md-sys-color-tertiary-container);
  border-color:var(--md-sys-color-tertiary);
  color:var(--md-sys-color-tertiary);
  box-shadow:var(--md-sys-elevation-level1);
}
.m3-card .bookmark-btn .material-symbols-rounded{
  font-size:20px;
  font-variation-settings:'FILL'0,'wght'400;
}
.m3-card .bookmark-btn.active .material-symbols-rounded{
  font-variation-settings:'FILL'1,'wght'500;
}
.bookmark-toast{
  position:absolute;top:12px;right:54px;
  font-size:11px;color:var(--md-sys-color-tertiary);
  background:var(--md-sys-color-tertiary-container);
  padding:2px 8px;border-radius:var(--md-sys-shape-extra-small);
  opacity:0;z-index:4;
  transition:opacity var(--md-sys-motion-duration-short) ease;
  pointer-events:none;
  white-space:nowrap;
}
.bookmark-toast.show{opacity:1;}

/* Card title */
.m3-card .card-title{
  font-size:17px;
  font-weight:600;
  color:var(--md-sys-color-on-surface);
  line-height:1.4;
  margin-bottom:4px;
  padding-right:40px;
}
.m3-card .card-author{
  font-size:14px;
  color:var(--md-sys-color-on-surface-variant);
  margin-bottom:10px;
}
.m3-card .card-chips{
  display:flex;
  gap:8px;
  margin-bottom:12px;
  flex-wrap:wrap;
}
.m3-card .m3-label{
  display:inline-flex;align-items:center;
  padding:4px 12px;
  border-radius:var(--md-sys-shape-small);
  font-size:12px;
  font-weight:600;
  line-height:1;
}
.m3-card .m3-label .material-symbols-rounded{
  font-size:12px;
  margin-right:4px;
}
.m3-card .card-summary{
  font-size:14px;
  color:var(--md-sys-color-on-surface-variant);
  line-height:1.7;
  margin-bottom:14px;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.m3-card .card-actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

/* M3 Text Button */
.m3-text-btn{
  display:inline-flex;align-items:center;gap:4px;
  height:32px;padding:0 10px;
  border:none;border-radius:var(--md-sys-shape-full);
  background:color-mix(in srgb, var(--md-sys-color-primary) 8%, transparent);
  color:var(--md-sys-color-primary);
  font-family:inherit;
  font-size:12px;
  font-weight:500;
  text-decoration:none;
  cursor:pointer;
  transition:background var(--md-sys-motion-duration-short) ease;
}
.m3-text-btn:hover{
  background:color-mix(in srgb, var(--md-sys-color-primary) 16%, transparent);
}
.m3-text-btn .material-symbols-rounded{
  font-size:14px;
  font-variation-settings:'FILL'0,'wght'500;
}

/* ======= Expandable Detail Section ======= */





.detail-section{margin-bottom:16px}
.detail-label{
  font-size:11px;
  font-weight:600;
  letter-spacing:0.5px;
  text-transform:uppercase;
  color:var(--md-sys-color-primary);
  margin-bottom:6px;
  display:flex;align-items:center;gap:4px;
}
.detail-label .material-symbols-rounded{
  font-size:14px;
}
.detail-content{
  font-size:14px;
  color:var(--md-sys-color-on-surface-variant);
  line-height:1.8;
}

.detail-takeaway{
  padding:12px 16px;
  margin-bottom:10px;
  background:var(--md-sys-color-surface-variant);
  border-radius:var(--md-sys-shape-small);
  border-left:4px solid var(--md-sys-color-primary);
  transition:background var(--md-sys-motion-duration-short) ease;
}
.detail-takeaway .takeaway-num{
  font-size:11px;
  font-weight:600;
  color:var(--md-sys-color-primary);
  margin-bottom:2px;
}
.detail-takeaway .takeaway-text{
  font-size:14px;
  color:var(--md-sys-color-on-surface);
  line-height:1.7;
}

.detail-loading{
  text-align:center;
  padding:24px;
  color:var(--md-sys-color-on-surface-variant);
  font-size:14px;
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.detail-loading .m3-spinner{
  width:20px;height:20px;
  border:2px solid var(--md-sys-color-outline-variant);
  border-top-color:var(--md-sys-color-primary);
  border-radius:50%;
  animation:m3-spin .6s linear infinite;
}
@keyframes m3-spin{to{transform:rotate(360deg)}}

/* ======= Empty State ======= */
.empty-state{
  grid-column:1/-1;
  text-align:center;
  padding:80px 20px;
  color:var(--md-sys-color-on-surface-variant);
}
.empty-state .empty-icon{
  font-size:64px;
  margin-bottom:16px;
  opacity:.4;
}
.empty-state .empty-title{
  font-size:18px;
  font-weight:500;
  color:var(--md-sys-color-on-surface);
  margin-bottom:8px;
}
.empty-state .empty-sub{
  font-size:14px;
  color:var(--md-sys-color-on-surface-variant);
}

/* ======= Footer ======= */
.footer{
  text-align:center;
  padding:24px 24px 48px;
  color:var(--md-sys-color-on-surface-variant);
  font-size:12px;
  line-height:1.8;
  opacity:.7;
}
.footer span{display:block}

/* ======= Animations ======= */
@keyframes fadeSlideUp{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}

/* ======= Responsive ======= */
@media(max-width:840px){
  .book-grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
}
@media(max-width:600px){
  .top-app-bar{padding:0 16px}
  .top-app-bar .headline{font-size:20px}
  .top-app-bar .leading-icon{width:36px;height:36px;margin-right:12px}
  .top-app-bar .leading-icon .material-symbols-rounded{font-size:20px}
  .content{padding:16px 16px 60px}
  .search-field .m3-input{height:48px;padding:12px 48px 12px 48px;font-size:15px}
  .book-grid{grid-template-columns:1fr;gap:12px}
  .m3-card{padding:20px 16px 16px}
  .m3-card .card-title{font-size:16px}
  .filter-row{gap:6px;margin-bottom:18px}
  .m3-chip{height:36px;padding:0 14px;font-size:13px}
  .tab-bar{gap:8px;margin-bottom:18px}
  .m3-tab{height:36px;padding:0 16px;font-size:13px}
}

/* ======= Safe area for iPhone ======= */

// ======= Constants =======
var CAT_COLORS={
  "金融/投資":"#F0B429",
  "人性/心理":"#E83E8C",
  "自我成長/習慣":"#2ECC71",
  "商業/創業思維":"#3498DB",
  "AI/學習":"#9B59B6",
  "親子教養":"#E67E22"
};
var DIFF_CLASSES={"入門":"easy","中階":"mid","進階":"hard"};
var CAT_ORDER=["金融/投資","人性/心理","自我成長/習慣","商業/創業思維","AI/學習","親子教養"];

// ======= State =======
var activeCat="";
var activeDiff="";
var searchQuery="";
var bookmarks=new Set();
var loadingSet=new Set();
var clickLock=false;
var darkTheme=false;

// Check saved preference
if(localStorage.getItem("md3-theme")==="dark"){darkTheme=true}

// ======= DOM refs =======
var gridEl=document.getElementById("bookGrid");
var tabsEl=document.getElementById("categoryTabs");
var searchEl=document.getElementById("searchInput");
var clearBtn=document.getElementById("searchClear");
var totalEl=document.getElementById("totalCount");
var bmEl=document.getElementById("bookmarkCount");
var themeBtn=document.getElementById("themeToggle");

// ======= Apply theme =======
function applyTheme(){
  if(darkTheme){
    document.documentElement.setAttribute("data-theme","dark");
    themeBtn.querySelector(".material-symbols-rounded").textContent="light_mode";
  }else{
    document.documentElement.removeAttribute("data-theme");
    themeBtn.querySelector(".material-symbols-rounded").textContent="dark_mode";
  }
  localStorage.setItem("md3-theme",darkTheme?"dark":"light");
}
applyTheme();

// Theme toggle
themeBtn.addEventListener("click",function(){darkTheme=!darkTheme;applyTheme()});

// ======= Build Tabs =======
function buildTabs(){
  var html='<button class="m3-tab active" data-cat="">全部</button>';
  CAT_ORDER.forEach(function(c){
    var col=CAT_COLORS[c]||"#888";
    html+='<button class="m3-tab" data-cat="'+c+'"><span class="dot" style="background:'+col+'"></span>'+c+'</button>';
  });
  tabsEl.innerHTML=html;
  tabsEl.addEventListener("click",function(e){
    var btn=e.target.closest(".m3-tab");
    if(!btn)return;
    tabsEl.querySelectorAll(".m3-tab").forEach(function(b){b.classList.remove("active")});
    btn.classList.add("active");
    activeCat=btn.dataset.cat;
    render();
  });
}

// ======= Difficulty filter =======
document.getElementById("difficultyFilter").addEventListener("click",function(e){
  var btn=e.target.closest(".m3-chip");
  if(!btn)return;
  document.getElementById("difficultyFilter").querySelectorAll(".m3-chip").forEach(function(b){b.classList.remove("active")});
  btn.classList.add("active");
  activeDiff=btn.dataset.diff;
  render();
});

// ======= Search =======
searchEl.addEventListener("input",function(){
  searchQuery=searchEl.value.trim().toLowerCase();
  if(searchQuery){clearBtn.classList.add("visible")}else{clearBtn.classList.remove("visible")}
  render();
});
clearBtn.addEventListener("click",function(){
  searchEl.value="";
  searchQuery="";
  clearBtn.classList.remove("visible");
  render();
  searchEl.focus();
});

// ======= Filter function =======
function filterBooks(){
  return BOOKS.filter(function(b){
    if(activeCat&&b.cat!==activeCat)return false;
    if(activeDiff&&b.diff!==activeDiff)return false;
    if(searchQuery){
      if(!b.title.toLowerCase().includes(searchQuery)&&!b.author.toLowerCase().includes(searchQuery))return false;
    }
    return true;
  });
}

// ======= Click handler with debounce =======
function loadAndShowModal(id){
  if(loadingSet.has(id))return;
  loadingSet.add(id);
  var modalContent=document.getElementById("modalContent");
  modalContent.innerHTML='<div class="detail-loading"><div class="m3-spinner"></div>載入中…</div>';
  document.getElementById("bookModal").classList.add("open");

  var x=new XMLHttpRequest();
  x.open("GET","/api/book?id="+id,true);
  x.onload=function(){
    if(x.status===200){
      var d=JSON.parse(x.responseText);
      var html='<div class="card-detail-inner">';
      if(d.overview){
        html+='<div class="detail-section">';
        html+='<div class="detail-label"><span class="material-symbols-rounded">book</span>概論</div>';
        html+='<div class="detail-content">'+d.overview+'</div></div>';
      }
      if(d.takeaways&&d.takeaways.length>0){
        html+='<div class="detail-section">';
        html+='<div class="detail-label"><span class="material-symbols-rounded">psychology</span>三個學習要點</div>';
        d.takeaways.forEach(function(t,i){
          html+='<div class="detail-takeaway">';
          html+='<div class="takeaway-num">要點 '+(i+1)+'</div>';
          html+='<div class="takeaway-text">'+t+'</div></div>';
        });
        html+='</div>';
      }
      html+='<div class="detail-section">';
      html+='<div class="detail-label"><span class="material-symbols-rounded">star</span>推薦原因</div>';
      html+='<div class="detail-content">'+d.why+'</div></div>';
      if(d.yt_ch&&d.yt_ch!=="N/A"){
        html+='<div class="detail-section">';
        html+='<div class="detail-label"><span class="material-symbols-rounded">play_circle</span>說書頻道</div>';
        html+='<div class="detail-content">'+d.yt_ch+'</div></div>';
      }
      html+='</div>';
      modalContent.innerHTML=html;
      modalContent.dataset.loaded=id;
    }else{
      modalContent.innerHTML='<div class="detail-loading">❌ 載入失敗</div>';
    }
    loadingSet.delete(id);
  };
  x.onerror=function(){
    modalContent.innerHTML='<div class="detail-loading">❌ 載入失敗</div>';
    loadingSet.delete(id);
  };
  x.send();
}

function handleCardClick(e){
  if(clickLock)return;
  clickLock=true;
  setTimeout(function(){clickLock=false},350);
  if(e.target.closest(".bookmark-btn")||e.target.closest("a"))return;
  var id=e.currentTarget.dataset.id;
  document.getElementById("modalTitle").textContent=e.currentTarget.querySelector(".card-title").textContent;
  loadAndShowModal(id);
}

// ======= Render =======
function render(){
  var list=filterBooks();
  totalEl.textContent=list.length;
  bmEl.textContent=bookmarks.size;

  if(list.length===0){
    gridEl.innerHTML='<div class="empty-state">';
    gridEl.innerHTML+='<div class="empty-icon"><span class="material-symbols-rounded" style="font-size:64px">search_off</span></div>';
    gridEl.innerHTML+='<div class="empty-title">搵唔到相關嘅書</div>';
    gridEl.innerHTML+='<div class="empty-sub">試吓用其他關鍵詞或者篩選條件</div></div>';
    return;
  }

  var html="";
  list.forEach(function(b,i){
    var col=CAT_COLORS[b.cat]||"#888";
    var diffClass=DIFF_CLASSES[b.diff]||"mid";
    var bmd=bookmarks.has(b.id);
    var iconFill=bmd?"1":"0";

    html+='<div class="m3-card" data-id="'+b.id+'" style="animation-delay:'+(i*0.03)+'s">';

    // Bookmark button
    html+='<button class="bookmark-btn'+(bmd?" active":"")+'" data-id="'+b.id+'" aria-label="'+(bmd?"取消收藏":"收藏")+'">';
    html+='<span class="material-symbols-rounded">'+ (bmd?"bookmark":"bookmark") +'</span></button>';

    // Bookmark toast
    html+='<div class="bookmark-toast" data-id="'+b.id+'">'+ (bmd?"已收藏":"") +'</div>';

    // Title + Author
    html+='<div class="card-title">'+b.title+'</div>';
    html+='<div class="card-author">'+b.author+'</div>';

    // Category + Difficulty labels
    html+='<div class="card-chips">';
    html+='<span class="m3-label" style="background:'+col+'20;color:'+col+'">'+b.cat+'</span>';
    html+='<span class="m3-label" style="background:var(--md-sys-color-surface-variant);color:var(--md-sys-color-on-surface-variant)">'+b.diff+'</span>';
    html+='</div>';

    // Summary
    html+='<div class="card-summary">'+b.sum+'</div>';

    // Action links
    html+='<div class="card-actions">';
    if(b.gr)html+='<a class="m3-text-btn" href="'+b.gr+'" target="_blank" rel="noopener"><span class="material-symbols-rounded">book</span>Goodreads</a>';
    if(b.amz)html+='<a class="m3-text-btn" href="'+b.amz+'" target="_blank" rel="noopener"><span class="material-symbols-rounded">inventory_2</span>Amazon</a>';
    if(b.wiki)html+='<a class="m3-text-btn" href="'+b.wiki+'" target="_blank" rel="noopener"><span class="material-symbols-rounded">public</span>Wiki</a>';
    if(b.yt)html+='<a class="m3-text-btn" href="'+b.yt+'" target="_blank" rel="noopener"><span class="material-symbols-rounded">play_circle</span>YouTube</a>';
    html+='</div>';

    // Detail expandable
    html+='<div class="card-detail"></div></div>';
  });

  gridEl.innerHTML=html;

  // Attach card click handlers
  gridEl.querySelectorAll(".m3-card").forEach(function(c){
    c.addEventListener("click",handleCardClick);
  });

  // Attach bookmark handlers
  gridEl.querySelectorAll(".bookmark-btn").forEach(function(btn){
    btn.addEventListener("click",function(e){
      e.stopPropagation();
      var id=btn.dataset.id;
      var toast=gridEl.querySelector('.bookmark-toast[data-id="'+id+'"]');
      if(bookmarks.has(id)){
        bookmarks.delete(id);
        btn.classList.remove("active");
        btn.querySelector(".material-symbols-rounded").textContent="bookmark";
        toast.textContent="";
        toast.classList.remove("show");
      }else{
        bookmarks.add(id);
        btn.classList.add("active");
        btn.querySelector(".material-symbols-rounded").textContent="bookmark";
        toast.textContent="已收藏 ⭐";
        toast.classList.add("show");
        setTimeout(function(){toast.classList.remove("show")},1500);
      }
      bmEl.textContent=bookmarks.size;
    });
  });
}

// ======= Init =======
buildTabs();
render();
</script>

<div class="m3-modal-overlay" id="bookModal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="m3-modal">
    <div class="m3-modal-header">
      <div class="m3-modal-title" id="modalTitle"></div>
      <button class="m3-modal-close" onclick="document.getElementById('bookModal').classList.remove('open')">
        <span class="material-symbols-rounded">close</span>
      </button>
    </div>
    <div class="m3-modal-body" id="modalContent">
      <div class="detail-loading"><div class="m3-spinner"></div></div>
    </div>
  </div>
</div>
</body>
</html>
